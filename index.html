<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SwitchBot history</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <script>
    (() => {
      try {
        const storedTheme = localStorage.getItem("switchbotTheme");
        const themeMedia = window.matchMedia?.("(prefers-color-scheme: dark)");
        const prefersDark = Boolean(themeMedia?.matches);
        const theme = storedTheme || (prefersDark ? "dark" : "light");

        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f8;
      --panel: #ffffff;
      --ink: #17201c;
      --muted: #66726d;
      --line: #d8dfdc;
      --button-bg: #ffffff;
      --button-border: #b9c4bf;
      --button-hover: #eef3f1;
      --chart-grid: #edf1ef;
      --shadow: rgb(20 30 25 / 6%);
      --error: #a12720;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #101412;
      --panel: #181f1c;
      --ink: #eef4f1;
      --muted: #a9b8b1;
      --line: #32403a;
      --button-bg: #202a26;
      --button-border: #50625a;
      --button-hover: #293630;
      --chart-grid: #202824;
      --shadow: rgb(0 0 0 / 22%);
      --error: #ff9288;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, sans-serif;
      line-height: 1.4;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2.5vw, 2.25rem);
      line-height: 1.1;
      letter-spacing: 0;
    }

    button {
      border: 1px solid var(--button-border);
      border-radius: 6px;
      background: var(--button-bg);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      padding: 0.48rem 0.75rem;
    }

    button:hover:not(:disabled) {
      background: var(--button-hover);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .button-group button[aria-pressed="true"] {
      background: var(--button-hover);
      border-color: var(--ink);
      font-weight: 650;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .auth-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status,
    .range {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .dashboard {
      display: grid;
      gap: 18px;
    }

    .chart-panel,
    .latest-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 2px var(--shadow);
    }

    .panel-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: 0;
    }

    .chart-box {
      height: 330px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    th,
    td {
      border-top: 1px solid var(--line);
      padding: 0.55rem 0.4rem;
      text-align: left;
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    .error {
      color: var(--error);
    }

    .mobile-only {
      display: none;
    }

    @media (max-width: 700px) {
      main {
        width: calc(100% - 12px);
        padding: 10px 0 20px;
      }

      header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }

      h1 {
        font-size: 1.25rem;
      }

      button {
        min-height: 44px;
        padding: 0.45rem 0.6rem;
      }

      .auth-actions {
        grid-column: 1 / -1;
        justify-content: end;
        gap: 6px;
      }

      .auth-actions .status {
        max-width: 190px;
        text-align: right;
      }

      .header-actions {
        display: contents;
      }

      #themeButton {
        grid-column: 2;
        grid-row: 1;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 10px;
      }

      .button-group {
        flex-wrap: nowrap;
        gap: 6px;
        width: 100%;
      }

      .button-group button {
        flex: 1 1 0;
      }

      .toolbar > .range {
        min-height: 1.25rem;
      }

      .dashboard {
        gap: 10px;
      }

      .chart-panel,
      .latest-panel {
        border-radius: 7px;
        padding: 10px;
      }

      .latest-panel {
        order: -1;
      }

      .panel-header {
        align-items: baseline;
        flex-wrap: wrap;
        gap: 3px 8px;
        margin-bottom: 6px;
      }

      .panel-header .range {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      #comfortTitle + .range {
        width: 100%;
      }

      h2 {
        font-size: 1rem;
      }

      .chart-box {
        height: 250px;
      }

      table {
        font-size: 0.84rem;
        table-layout: fixed;
      }

      th,
      td {
        padding: 0.45rem 0.2rem;
        text-align: right;
      }

      th:first-child,
      td:first-child {
        text-align: left;
        width: 28%;
      }

      .desktop-only {
        display: none;
      }

      .mobile-only {
        display: inline;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>SwitchBot history</h1>
      <div class="header-actions">
        <button id="themeButton" type="button" aria-pressed="false">Dark</button>
        <div class="auth-actions">
          <button id="signInButton" type="button">Sign in</button>
          <button id="signOutButton" type="button" hidden>Sign out</button>
          <div class="status" id="status">Sign in to load readings</div>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <div class="button-group" id="rangeButtons"></div>
      <div class="range" id="summary"></div>
    </div>

    <section class="dashboard">
      <section class="chart-panel" aria-labelledby="temperatureTitle">
        <div class="panel-header">
          <h2 id="temperatureTitle">Temperature <span class="mobile-only">(C)</span></h2>
          <div class="range" id="temperatureRange"></div>
        </div>
        <div class="chart-box">
          <canvas id="temperatureChart"></canvas>
        </div>
      </section>

      <section class="chart-panel" aria-labelledby="humidityTitle">
        <div class="panel-header">
          <h2 id="humidityTitle">Humidity <span class="mobile-only">(%)</span></h2>
          <div class="range" id="humidityRange"></div>
        </div>
        <div class="chart-box">
          <canvas id="humidityChart"></canvas>
        </div>
      </section>

      <section class="chart-panel" aria-labelledby="comfortTitle">
        <div class="panel-header">
          <h2 id="comfortTitle">Temperature and humidity</h2>
          <div class="range">
            <span class="desktop-only">Indoor comfort: PMV -0.5 to +0.5 and 30-60% RH; 0.1 m/s air, 1.1 met, 0.7 clo</span>
            <span class="mobile-only">Temperature (C) × RH (%); PMV -0.5 to +0.5; 30-60% RH</span>
          </div>
        </div>
        <div class="chart-box">
          <canvas id="comfortChart"></canvas>
        </div>
      </section>

      <section class="latest-panel" aria-labelledby="latestTitle">
        <div class="panel-header">
          <h2 id="latestTitle">Latest logged reading</h2>
        </div>
        <div id="latestReading"></div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      onAuthStateChanged,
      signInWithPopup,
      signOut,
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc,
      getDoc,
      getFirestore,
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import {
      getReadingsLast24Hours,
      getReadingsLast7Days,
      getReadingsLast30Days,
      setClientKey,
      setWorkerBase,
    } from "./switchbotapi.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBwLI4d70iDuAaf7fNwn0WX-kny01nmT5k",
      authDomain: "common-77900.firebaseapp.com",
      projectId: "common-77900",
      storageBucket: "common-77900.firebasestorage.app",
      messagingSenderId: "667782892801",
      appId: "1:667782892801:web:a30ef02706b7c385b51f00",
    };

    const SENSORS = [
      {
        name: "Terrace",
        color: "#c43f2f",
        darkColor: "#ff776c",
        temperatureKey: "terrace_temp_c",
        humidityKey: "terrace_humidity_pct",
      },
      {
        name: "Kitchen",
        color: "#2374ab",
        darkColor: "#61bfff",
        temperatureKey: "kitchen_temp_c",
        humidityKey: "kitchen_humidity_pct",
      },
      {
        name: "Bedroom",
        color: "#238b45",
        darkColor: "#68df91",
        temperatureKey: "bedroom_temp_c",
        humidityKey: "bedroom_humidity_pct",
      },
    ];

    const METEOSWISS_STATION = {
      label: "MeteoSwiss Pully",
      station: "PUY",
      tenMinute: {
        urls: [
          "https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/puy/ogd-smn_puy_t_recent.csv",
          "https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/puy/ogd-smn_puy_t_now.csv",
        ],
        temperatureKey: "tre200s0",
        humidityKey: "ure200s0",
      },
      hourly: {
        urls: [
          "https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/puy/ogd-smn_puy_h_recent.csv",
          "https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/puy/ogd-smn_puy_h_now.csv",
        ],
        temperatureKey: "tre200h0",
        humidityKey: "ure200h0",
      },
      color: "#6d5bd0",
      darkColor: "#c4b5ff",
    };

    const METEOSWISS_FORECAST = {
      label: "MeteoSwiss forecast Morges",
      pointId: "10312",
      pointTypeId: "1",
      collectionUrl: "https://data.geo.admin.ch/api/stac/v1/collections/ch.meteoschweiz.ogd-local-forecasting/items",
      temperatureKey: "tre200h0",
      color: "#8b5a2b",
      darkColor: "#f5c16c",
    };

    const RANGES = [
      {
        label: "last 24 hours",
        buttonText: "Load last 24 hours",
        shortButtonText: "24h",
        days: 1,
        loader: () => getReadingsLast24Hours({ limit: 2000 }),
      },
      {
        label: "last 7 days",
        buttonText: "Load last 7 days",
        shortButtonText: "7d",
        days: 7,
        loader: () => getReadingsLast7Days({ limit: 12000 }),
      },
      {
        label: "last 30 days",
        buttonText: "Load last 30 days",
        shortButtonText: "30d",
        days: 30,
        loader: () => getReadingsLast30Days({ limit: 45000 }),
      },
    ];

    const COMFORT_ASSUMPTIONS = {
      airSpeedMs: 0.1,
      metabolicRateMet: 1.1,
      clothingClo: 0.7,
      minimumHumidityPct: 30,
      maximumHumidityPct: 60,
      contourLevels: [-1, -0.5, 0, 0.5, 1],
    };

    const comfortBackgroundPlugin = {
      id: "comfortBackground",
      beforeDraw(chart) {
        drawComfortBackground(chart);
      },
    };

    const rangeButtonsEl = document.getElementById("rangeButtons");
    const themeButton = document.getElementById("themeButton");
    const signInButton = document.getElementById("signInButton");
    const signOutButton = document.getElementById("signOutButton");
    const statusEl = document.getElementById("status");
    const summaryEl = document.getElementById("summary");
    const latestReadingEl = document.getElementById("latestReading");
    const temperatureRangeEl = document.getElementById("temperatureRange");
    const humidityRangeEl = document.getElementById("humidityRange");
    const mobileLayoutMedia = window.matchMedia("(max-width: 700px)");

    let rows = [];
    let currentRangeDays = 1;
    let temperatureChart = null;
    let humidityChart = null;
    let comfortChart = null;
    let isAuthorized = false;
    let hasTriedAutoSignIn = false;
    let hasAutoLoadedInitialRange = false;
    let meteoSwissRows = [];
    let forecastRows = [];
    let activeLoadId = 0;

    initializeTheme();
    const loadButtons = renderRangeButtons();
    createCharts();
    mobileLayoutMedia.addEventListener("change", applyChartViewport);
    setLoading(true);
    initializeFirebaseAuth();

    function initializeTheme() {
      const storedTheme = getStoredTheme();
      const themeMedia = window.matchMedia?.("(prefers-color-scheme: dark)");
      const prefersDark = Boolean(themeMedia?.matches);
      const initialTheme = storedTheme || (prefersDark ? "dark" : "light");

      setTheme(initialTheme);

      themeButton.addEventListener("click", () => {
        const nextTheme = document.documentElement.dataset.theme === "dark"
          ? "light"
          : "dark";

        storeTheme(nextTheme);
        setTheme(nextTheme);
      });

      themeMedia?.addEventListener("change", event => {
        if (getStoredTheme()) {
          return;
        }

        setTheme(event.matches ? "dark" : "light");
      });
    }

    function setTheme(theme) {
      const isDark = theme === "dark";

      document.documentElement.dataset.theme = isDark ? "dark" : "light";
      themeButton.textContent = isDark ? "Light" : "Dark";
      themeButton.setAttribute("aria-pressed", String(isDark));
      applyChartTheme();
    }

    function getStoredTheme() {
      try {
        return localStorage.getItem("switchbotTheme");
      } catch {
        return null;
      }
    }

    function storeTheme(theme) {
      try {
        localStorage.setItem("switchbotTheme", theme);
      } catch {
        // Theme persistence is nice to have; the toggle still works without it.
      }
    }

    function applyChartTheme() {
      [temperatureChart, humidityChart, comfortChart].forEach(chart => {
        if (!chart) {
          return;
        }

        const ink = cssVar("--ink");
        const muted = cssVar("--muted");
        const grid = cssVar("--chart-grid");

        chart.options.plugins.legend.labels.color = ink;
        chart.options.scales.x.grid.color = grid;
        chart.options.scales.x.ticks.color = muted;
        chart.options.scales.y.grid.color = grid;
        chart.options.scales.y.ticks.color = muted;
        chart.options.scales.y.title.color = muted;
        chart.data.datasets.forEach(dataset => {
          const sensor = SENSORS.find(item => item.name === dataset.label);

          if (sensor) {
            const color = sensorChartColor(sensor);
            dataset.borderColor = color;
            dataset.backgroundColor = color;
            dataset.pointBackgroundColor = color;
            dataset.pointBorderColor = cssVar("--panel");
          }

          if (dataset.label === METEOSWISS_STATION.label) {
            const color = meteoSwissChartColor();
            dataset.borderColor = color;
            dataset.backgroundColor = color;
          }

          if (dataset.label === METEOSWISS_FORECAST.label) {
            const color = forecastChartColor();
            dataset.borderColor = color;
            dataset.backgroundColor = color;
          }
        });
        chart.update();
      });
    }

    function initializeFirebaseAuth() {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const provider = new GoogleAuthProvider();

      signInButton.addEventListener("click", () => {
        signInWithPopup(auth, provider).catch(showError);
      });

      signOutButton.addEventListener("click", () => {
        signOut(auth).catch(showError);
      });

      onAuthStateChanged(auth, user => {
        handleAuthState(user, auth, provider, db).catch(showError);
      });
    }

    async function handleAuthState(user, auth, provider, db) {
      activeLoadId += 1;
      setClientKey("");
      setWorkerBase("");
      isAuthorized = false;
      rows = [];
      meteoSwissRows = [];
      forecastRows = [];
      updateChart(temperatureChart, "temperatureKey", "C", temperatureRangeEl);
      updateChart(humidityChart, "humidityKey", "%", humidityRangeEl);
      updateComfortChart();
      renderLatestReading();

      signInButton.hidden = Boolean(user);
      signOutButton.hidden = !user;

      if (!user) {
        summaryEl.textContent = "";
        hasAutoLoadedInitialRange = false;
        setStatus("Sign in to load readings");
        setLoading(true);
        tryAutoSignIn(auth, provider);
        return;
      }

      setStatus("Loading access...");
      const secretSnapshot = await getDoc(doc(db, "secrets", "switchbot"));

      if (!secretSnapshot.exists()) {
        throw new Error("Missing Firestore document secrets/switchbot.");
      }

      const secret = secretSnapshot.data();
      const clientKey = secret.CLIENTKEY;
      const workerUrl = secret.WORKERURL;

      if (typeof clientKey !== "string" || clientKey.length === 0) {
        throw new Error("Missing Firestore field secrets/switchbot.CLIENTKEY.");
      }

      if (typeof workerUrl !== "string" || workerUrl.length === 0) {
        throw new Error("Missing Firestore field secrets/switchbot.WORKERURL.");
      }

      setClientKey(clientKey);
      setWorkerBase(workerUrl);
      isAuthorized = true;
      setStatus(`Signed in as ${user.email}`);
      setLoading(false);

      if (!hasAutoLoadedInitialRange) {
        hasAutoLoadedInitialRange = true;
        await loadHistory(RANGES[0]);
      }
    }

    function tryAutoSignIn(auth, provider) {
      if (hasTriedAutoSignIn) {
        return;
      }

      hasTriedAutoSignIn = true;
      setStatus("Opening sign-in...");

      signInWithPopup(auth, provider).catch(error => {
        if (
          error?.code === "auth/popup-closed-by-user" ||
          error?.code === "auth/cancelled-popup-request"
        ) {
          setStatus("Sign in to load readings");
          return;
        }

        if (error?.code === "auth/popup-blocked") {
          setStatus("Popup blocked. Use Sign in to load readings.");
          setLoading(false);
          return;
        }

        showError(error);
      });
    }

    async function loadHistory({ label, days, loader }) {
      if (!isAuthorized) {
        setStatus("Sign in to load readings");
        return;
      }

      setLoading(true);
      currentRangeDays = days;
      loadButtons.forEach((button, index) => {
        button.setAttribute("aria-pressed", String(RANGES[index].days === days));
      });
      setStatus(`Loading ${label}...`);

      const loadId = ++activeLoadId;
      const loadedAt = Date.now();
      const data = await loader();

      if (loadId !== activeLoadId) {
        return;
      }

      rows = (data.rows ?? [])
        .map(normalizeRow)
        .filter(row => Number.isFinite(row.timeMs))
        .sort((a, b) => a.timeMs - b.timeMs);

      // Show the fast device readings without waiting for either MeteoSwiss source.
      meteoSwissRows = [];
      forecastRows = [];
      updateChart(temperatureChart, "temperatureKey", "C", temperatureRangeEl);
      updateChart(humidityChart, "humidityKey", "%", humidityRangeEl);
      updateComfortChart();
      renderLatestReading();

      const first = rows.at(0);
      const last = rows.at(-1);
      summaryEl.textContent = rows.length && first && last
        ? `${rows.length} readings from ${formatTime(first.timeMs)} to ${formatTime(last.timeMs)}`
        : "No readings found.";

      setStatus(`Device data updated ${formatTime(loadedAt)}; loading MeteoSwiss data...`);

      // Fetch both slower sources concurrently and add each result as soon as it arrives.
      const meteoSwissPromise = loadMeteoSwissReadings(days, loadedAt)
        .then(loadedRows => {
          if (loadId !== activeLoadId) {
            return null;
          }

          meteoSwissRows = loadedRows;
          updateChart(temperatureChart, "temperatureKey", "C", temperatureRangeEl);
          updateChart(humidityChart, "humidityKey", "%", humidityRangeEl);
          return null;
        })
        .catch(error => {
          if (loadId !== activeLoadId) {
            return null;
          }

          meteoSwissRows = [];
          console.warn(error);
          return error;
        });

      const forecastPromise = loadMeteoSwissForecast(
        loadedAt - 24 * 60 * 60 * 1000,
        loadedAt + days * 24 * 60 * 60 * 1000
      )
        .then(loadedRows => {
          if (loadId !== activeLoadId) {
            return null;
          }

          forecastRows = loadedRows;
          updateChart(temperatureChart, "temperatureKey", "C", temperatureRangeEl);
          return null;
        })
        .catch(error => {
          if (loadId !== activeLoadId) {
            return null;
          }

          forecastRows = [];
          console.warn(error);
          return error;
        });

      const [meteoSwissError, forecastError] = await Promise.all([
        meteoSwissPromise,
        forecastPromise,
      ]);

      if (loadId !== activeLoadId) {
        return;
      }

      setStatus(
        meteoSwissError || forecastError
          ? `Updated ${formatTime(loadedAt)} (some MeteoSwiss data unavailable)`
          : `Updated ${formatTime(loadedAt)}`
      );
      setLoading(false);
    }

    function renderRangeButtons() {
      return RANGES.map(range => {
        const button = document.createElement("button");
        button.type = "button";
        button.setAttribute("aria-label", range.buttonText);
        button.setAttribute("aria-pressed", String(range.days === currentRangeDays));

        const desktopLabel = document.createElement("span");
        desktopLabel.className = "desktop-only";
        desktopLabel.textContent = range.buttonText;

        const mobileLabel = document.createElement("span");
        mobileLabel.className = "mobile-only";
        mobileLabel.textContent = range.shortButtonText;

        button.append(desktopLabel, mobileLabel);
        button.addEventListener("click", () => {
          loadHistory(range).catch(showError);
        });
        rangeButtonsEl.append(button);
        return button;
      });
    }

    function createCharts() {
      temperatureChart = createLineChart("temperatureChart", "Temperature", "C");
      humidityChart = createLineChart("humidityChart", "Humidity", "%");
      comfortChart = createComfortChart();
      applyChartTheme();
      applyChartViewport();
    }

    function applyChartViewport() {
      const isMobile = mobileLayoutMedia.matches;

      [temperatureChart, humidityChart].forEach(chart => {
        if (!chart) {
          return;
        }

        chart.options.plugins.tooltip.enabled = !isMobile;
        chart.options.scales.x.ticks.maxTicksLimit = isMobile ? 4 : 8;
        chart.options.scales.y.title.display = !isMobile;
      });

      if (comfortChart) {
        comfortChart.options.scales.x.ticks.maxTicksLimit = isMobile ? 5 : 10;
        comfortChart.options.scales.y.ticks.maxTicksLimit = isMobile ? 6 : 11;

          rows
            .map(row => ({

    function updateComfortXAxisRange(chart) {
      const temperatures = chart.data.datasets.flatMap((dataset, index) => (
        chart.isDatasetVisible(index)
          ? dataset.data
            .map(point => numberOrNull(point.x))
            .filter(value => value !== null)
          : []
      ));

      chart.options.scales.x.min = temperatures.length > 0
        ? Math.min(22, Math.floor(Math.min(...temperatures)))
        : 22;
      chart.options.scales.x.max = temperatures.length > 0
        ? Math.max(27, Math.ceil(Math.max(...temperatures)))
        : 27;
    }

    function downsampleTrajectory(points, maxPoints = 1800) {
      if (points.length <= maxPoints) {
        return points;
      }

      return Array.from({ length: maxPoints }, (_, index) => (
        points[Math.round(index * (points.length - 1) / (maxPoints - 1))]
      ));
    }

    function updateChart(chart, sensorValueKey, unit, rangeEl) {
      const allValues = [];

      chart.data.datasets = SENSORS.map(sensor => {
        const data = rows
          .map(row => ({
            x: row.timeMs,
            y: numberOrNull(row[sensor[sensorValueKey]]),
          }))
          .filter(point => point.y !== null);

        allValues.push(...data.map(point => point.y));

        return {
          label: sensor.name,
          data,
          borderColor: sensorChartColor(sensor),
          backgroundColor: sensorChartColor(sensor),
          borderWidth: 2.5,
          pointRadius: 0,
          pointHoverRadius: 4,
          spanGaps: true,
          tension: 0.25,
        };
      });

      if (meteoSwissRows.length > 0) {
        const valueKey = chart === temperatureChart
          ? "temperatureC"
          : "humidityPct";
        const data = meteoSwissRows
          .map(row => ({
            x: row.timeMs,
            y: row[valueKey],
          }))
          .filter(point => point.y !== null);

        if (data.length > 0) {
          allValues.push(...data.map(point => point.y));
          chart.data.datasets.push({
            label: METEOSWISS_STATION.label,
            data,
            borderColor: meteoSwissChartColor(),
            backgroundColor: meteoSwissChartColor(),

            borderWidth: 2.5,
            pointRadius: 0,
            pointHoverRadius: 4,
            spanGaps: true,
            tension: 0.25,
          });
        }
      }

      if (chart === temperatureChart && forecastRows.length > 0) {
        const data = forecastRows.map(row => ({
          x: row.timeMs,
          y: row.temperatureC,
        }));

        allValues.push(...data.map(point => point.y));
        chart.data.datasets.push({
          label: METEOSWISS_FORECAST.label,
          data,
          borderColor: forecastChartColor(),
          backgroundColor: forecastChartColor(),
          borderDash: [2, 5],
          borderWidth: 2.5,
          pointRadius: 0,
          pointHoverRadius: 4,
          spanGaps: true,
          tension: 0.25,
        });
      }

      rangeEl.textContent = allValues.length
        ? `${Math.min(...allValues).toFixed(1)}-${Math.max(...allValues).toFixed(1)} ${unit}`
        : "";

      updateTimeXAxisRange(chart);
      chart.update();

    function handleLegendClick(event, legendItem, legend) {
      const chart = legend.chart;
      const datasetIndex = legendItem.datasetIndex;

      chart.setDatasetVisibility(
        datasetIndex,
        !chart.isDatasetVisible(datasetIndex)
      );

      if (chart === comfortChart) {
        updateComfortXAxisRange(chart);
      } else {
        updateTimeXAxisRange(chart);
      }

      chart.update();
    }

    function updateTimeXAxisRange(chart) {
      const halfHourMs = 30 * 60 * 1000;
      let earliest = Infinity;
      let latest = -Infinity;

      chart.data.datasets.forEach((dataset, index) => {
        if (!chart.isDatasetVisible(index)) {
          return;
        }

        dataset.data.forEach(point => {
          const time = Number(point.x);

          if (Number.isFinite(time)) {
            earliest = Math.min(earliest, time);
            latest = Math.max(latest, time);
          }
        });
      });

      if (!Number.isFinite(earliest) || !Number.isFinite(latest)) {
        delete chart.options.scales.x.min;
        delete chart.options.scales.x.max;
        return;
      }

      const minimum = Math.floor(earliest / halfHourMs) * halfHourMs;
      let maximum = Math.ceil(latest / halfHourMs) * halfHourMs;

      if (maximum <= minimum) {
        maximum = minimum + halfHourMs;
      }

      chart.options.scales.x.min = minimum;
      chart.options.scales.x.max = maximum;
    }

    function normalizeRow(row) {
      return {
        ...row,
        timeMs: Number(row.sampled_at_ms),
      };

    async function loadMeteoSwissReadings(days, toMs) {
      const fromMs = toMs - days * 24 * 60 * 60 * 1000;
      const source = days === 1
        ? METEOSWISS_STATION.tenMinute
        : METEOSWISS_STATION.hourly;

      const texts = await Promise.all(
        source.urls.map(async url => {
          const response = await fetch(url);

          if (!response.ok) {
            throw new Error(`Could not load ${METEOSWISS_STATION.label} data: HTTP ${response.status}.`);
          }

          return response.text();
        })
      );

      const readingsByTime = new Map();

      texts.flatMap(parseCsv)
        .filter(row => row.station_abbr === METEOSWISS_STATION.station)
        .forEach(row => {
          const timeMs = parseMeteoSwissTimestamp(row.reference_timestamp);
          const temperatureC = numberOrNull(row[source.temperatureKey]);
          const humidityPct = numberOrNull(row[source.humidityKey]);

          if (
            Number.isFinite(timeMs) &&
            timeMs >= fromMs &&
            timeMs <= toMs &&
            (temperatureC !== null || humidityPct !== null)
          ) {
            readingsByTime.set(timeMs, { timeMs, temperatureC, humidityPct });
          }
        });

      return Array.from(readingsByTime.values())
        .sort((a, b) => a.timeMs - b.timeMs);
    }

    async function loadMeteoSwissForecast(fromMs, toMs) {
      const assetUrl = await findLatestForecastAssetUrl();
      const response = await fetch(assetUrl);

      if (!response.ok) {
        throw new Error(`Could not load ${METEOSWISS_FORECAST.label} data: HTTP ${response.status}.`);
      }

      const rowsByTime = new Map();

      parseCsv(await response.text())
        .filter(row =>
          row.point_id === METEOSWISS_FORECAST.pointId &&
          row.point_type_id === METEOSWISS_FORECAST.pointTypeId
        )
        .forEach(row => {
          const timeMs = parseCompactUtcTimestamp(row.Date);
          const temperatureC = numberOrNull(row[METEOSWISS_FORECAST.temperatureKey]);

          if (
            Number.isFinite(timeMs) &&
            timeMs >= fromMs &&
            timeMs <= toMs &&
            temperatureC !== null
          ) {
            rowsByTime.set(timeMs, { timeMs, temperatureC });
          }
        });

      return Array.from(rowsByTime.values())
        .sort((a, b) => a.timeMs - b.timeMs);
    }

    async function findLatestForecastAssetUrl() {
      const today = new Date();
      const candidateItemIds = [
        formatCompactUtcDate(today),
        formatCompactUtcDate(new Date(today.getTime() - 24 * 60 * 60 * 1000)),
      ];

      for (const itemId of candidateItemIds) {
        const response = await fetch(`${METEOSWISS_FORECAST.collectionUrl}/${itemId}-ch`);

        if (!response.ok) {
          continue;
        }

        const item = await response.json();
        const asset = Object.entries(item.assets ?? {})
          .filter(([name]) => name.endsWith(`.${METEOSWISS_FORECAST.temperatureKey}.csv`))
          .sort(([a], [b]) => b.localeCompare(a))
          .at(0);

        if (asset) {
          return asset[1].href;
        }
      }

      throw new Error(`Could not find ${METEOSWISS_FORECAST.label} data.`);
    }

    function parseCsv(text) {
      const lines = text.trim().split(/\r?\n/).filter(Boolean);

      if (lines.length < 2) {
        return [];
      }

      const headers = lines[0].split(";");

      return lines.slice(1).map(line => {
        const values = line.split(";");

        return Object.fromEntries(
          headers.map((header, index) => [header, values[index] ?? ""])
        );
      });
    }

    function parseMeteoSwissTimestamp(value) {
      const match = /^(\d{2})\.(\d{2})\.(\d{4}) (\d{2}):(\d{2})$/.exec(value);

      if (!match) {
        return NaN;
      }

      const [, day, month, year, hour, minute] = match.map(Number);

      return Date.UTC(year, month - 1, day, hour, minute);
    }

    function parseCompactUtcTimestamp(value) {
      const match = /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})$/.exec(value);

      if (!match) {
        return NaN;
      }

      const [, year, month, day, hour, minute] = match.map(Number);

      return Date.UTC(year, month - 1, day, hour, minute);
    }

    function formatCompactUtcDate(date) {
      return [
        date.getUTCFullYear(),
        String(date.getUTCMonth() + 1).padStart(2, "0"),
        String(date.getUTCDate()).padStart(2, "0"),
      ].join("");
    }

    function cssVar(name) {

    function sensorChartColor(sensor) {

        ? sensor.darkColor
        : sensor.color;
    }

    function meteoSwissChartColor() {
      return document.documentElement.dataset.theme === "dark"
        ? METEOSWISS_STATION.darkColor
        : METEOSWISS_STATION.color;
    }

    function forecastChartColor() {
      return document.documentElement.dataset.theme === "dark"
        ? METEOSWISS_FORECAST.darkColor
        : METEOSWISS_FORECAST.color;
    }

    function drawComfortBackground(chart) {
      const { ctx, chartArea, scales } = chart;

      if (!chartArea || !scales.x || !scales.y) {
        return;
      }

      const isDark = document.documentElement.dataset.theme === "dark";
      const contourColor = isDark
        ? "rgb(210 225 218 / 42%)"
        : "rgb(75 89 83 / 42%)";
      const comfortFill = isDark
        ? "rgb(65 170 105 / 15%)"
        : "rgb(65 170 105 / 11%)";

      ctx.save();
      ctx.beginPath();
      ctx.rect(
        chartArea.left,
        chartArea.top,
        chartArea.right - chartArea.left,
        chartArea.bottom - chartArea.top
      );
      ctx.clip();

      drawComfortBand(ctx, scales.x, scales.y, comfortFill);
      COMFORT_ASSUMPTIONS.contourLevels.forEach(level => {
        drawPmvContour(ctx, scales.x, scales.y, level, contourColor);
      });

      ctx.restore();
    }

    function drawComfortBand(ctx, xScale, yScale, fillStyle) {
      const segments = [];
      let segment = [];
      const samples = 160;

      for (let index = 0; index <= samples; index += 1) {
        const temperature = xScale.min
          + index / samples * (xScale.max - xScale.min);
        const range = comfortHumidityRange(temperature);

        if (range) {
          segment.push({
            x: xScale.getPixelForValue(temperature),
            lowerY: yScale.getPixelForValue(range.lower),
            upperY: yScale.getPixelForValue(range.upper),
          });
        } else if (segment.length > 0) {
          segments.push(segment);
          segment = [];
        }
      }

      if (segment.length > 0) {
        segments.push(segment);
      }

      ctx.fillStyle = fillStyle;
      segments.forEach(points => {
        if (points.length < 2) {
          return;
        }

        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].upperY);
        points.slice(1).forEach(point => ctx.lineTo(point.x, point.upperY));
        points.slice().reverse().forEach(point => ctx.lineTo(point.x, point.lowerY));
        ctx.closePath();
        ctx.fill();
      });
    }

    function drawPmvContour(ctx, xScale, yScale, level, strokeStyle) {
      const segments = [];
      let segment = [];
      const samples = 200;

      for (let index = 0; index <= samples; index += 1) {
        const temperature = xScale.min
          + index / samples * (xScale.max - xScale.min);
        const humidity = humidityForPmv(temperature, level);

        if (humidity !== null) {
          segment.push({
            x: xScale.getPixelForValue(temperature),
            y: yScale.getPixelForValue(humidity),
          });
        } else if (segment.length > 0) {
          segments.push(segment);
          segment = [];
        }
      }

      if (segment.length > 0) {
        segments.push(segment);
      }

      segments.forEach(points => {
        if (points.length < 2) {
          return;
        }

        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        points.slice(1).forEach(point => ctx.lineTo(point.x, point.y));
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = level === 0 ? 1.25 : 0.8;
        ctx.setLineDash(level === 0 ? [] : [3, 4]);
        ctx.stroke();

        const labelPoint = points[Math.floor(points.length / 2)];
        ctx.fillStyle = strokeStyle;
        ctx.font = "11px system-ui, sans-serif";
        ctx.textBaseline = "bottom";
        ctx.fillText(formatPmvLevel(level), labelPoint.x + 4, labelPoint.y - 3);
      });

      ctx.setLineDash([]);
    }

    function comfortHumidityRange(temperature) {
      const dryPmv = estimatedPmv(temperature, 0);
      const humidPmv = estimatedPmv(temperature, 100);

      if (
        dryPmv === null ||
        humidPmv === null ||
        humidPmv < -0.5 ||
        dryPmv > 0.5
      ) {
        return null;
      }

      const pmvLower = dryPmv >= -0.5
        ? 0
        : humidityForPmv(temperature, -0.5);
      const pmvUpper = humidPmv <= 0.5
        ? 100
        : humidityForPmv(temperature, 0.5);

      if (pmvLower === null || pmvUpper === null) {
        return null;
      }

      const lower = Math.max(
        pmvLower,
        COMFORT_ASSUMPTIONS.minimumHumidityPct
      );
      const upper = Math.min(
        pmvUpper,
        COMFORT_ASSUMPTIONS.maximumHumidityPct
      );

      return lower <= upper ? { lower, upper } : null;
    }

    function humidityForPmv(temperature, targetPmv) {
      let lower = 0;
      let upper = 100;
      const lowerPmv = estimatedPmv(temperature, lower);
      const upperPmv = estimatedPmv(temperature, upper);

      if (
        lowerPmv === null ||
        upperPmv === null ||
        targetPmv < lowerPmv ||
        targetPmv > upperPmv
      ) {
        return null;
      }

      for (let iteration = 0; iteration < 18; iteration += 1) {
        const middle = (lower + upper) / 2;
        const middlePmv = estimatedPmv(temperature, middle);

        if (middlePmv < targetPmv) {
          lower = middle;
        } else {
          upper = middle;
        }
      }

      return (lower + upper) / 2;
    }

    function estimatedPmv(temperature, relativeHumidity) {
      const radiantTemperature = temperature;
      const airSpeed = COMFORT_ASSUMPTIONS.airSpeedMs;
      const metabolicRate = COMFORT_ASSUMPTIONS.metabolicRateMet;
      const clothing = COMFORT_ASSUMPTIONS.clothingClo;
      const vaporPressure = relativeHumidity * 10
        * Math.exp(16.6536 - 4030.183 / (temperature + 235));
      const clothingInsulation = 0.155 * clothing;
      const metabolism = metabolicRate * 58.15;
      const internalHeat = metabolism;
      const clothingAreaFactor = clothingInsulation <= 0.078
        ? 1 + 1.29 * clothingInsulation
        : 1.05 + 0.645 * clothingInsulation;
      const forcedConvection = 12.1 * Math.sqrt(airSpeed);
      const airKelvin = temperature + 273;
      const radiantKelvin = radiantTemperature + 273;
      const initialClothingTemperature = airKelvin
        + (35.5 - temperature) / (3.5 * clothingInsulation + 0.1);
      const p1 = clothingInsulation * clothingAreaFactor;
      const p2 = p1 * 3.96;
      const p3 = p1 * 100;
      const p4 = p1 * airKelvin;
      const p5 = 308.7 - 0.028 * internalHeat
        + p2 * Math.pow(radiantKelvin / 100, 4);
      let clothingTemperature = initialClothingTemperature / 100;
      let previous = initialClothingTemperature / 50;
      let convection = forcedConvection;
      let iterations = 0;

      while (Math.abs(clothingTemperature - previous) > 0.00015) {
        previous = (previous + clothingTemperature) / 2;
        const naturalConvection = 2.38
          * Math.pow(Math.abs(100 * previous - airKelvin), 0.25);
        convection = Math.max(forcedConvection, naturalConvection);
        clothingTemperature = (
          p5 + p4 * convection - p2 * Math.pow(previous, 4)
        ) / (100 + p3 * convection);
        iterations += 1;

        if (iterations > 150) {
          return null;
        }
      }

      const clothingSurfaceC = 100 * clothingTemperature - 273;
      const skinDiffusion = 3.05 * 0.001
        * (5733 - 6.99 * internalHeat - vaporPressure);
      const sweating = internalHeat > 58.15
        ? 0.42 * (internalHeat - 58.15)
        : 0;
      const latentRespiration = 1.7 * 0.00001 * metabolism
        * (5867 - vaporPressure);
      const dryRespiration = 0.0014 * metabolism * (34 - temperature);
      const radiation = 3.96 * clothingAreaFactor * (
        Math.pow(clothingTemperature, 4)
        - Math.pow(radiantKelvin / 100, 4)
      );
      const convectionLoss = clothingAreaFactor * convection
        * (clothingSurfaceC - temperature);
      const thermalSensationTransfer = 0.303
        * Math.exp(-0.036 * metabolism) + 0.028;

      return thermalSensationTransfer * (
        internalHeat - skinDiffusion - sweating - latentRespiration
        - dryRespiration - radiation - convectionLoss
      );
    }

    function formatPmvLevel(level) {
      if (level > 0) {
        return `PMV +${level}`;
      }

      return `PMV ${level}`;
    }

    function colorWithAlpha(hexColor, alpha) {
      const value = hexColor.replace("#", "");
      const red = Number.parseInt(value.slice(0, 2), 16);
      const green = Number.parseInt(value.slice(2, 4), 16);
      const blue = Number.parseInt(value.slice(4, 6), 16);

      return `rgb(${red} ${green} ${blue} / ${alpha})`;
    }

    function numberOrNull(value) {
      if (value === null || value === undefined || value === "") {
        return null;
      }

      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function absoluteHumidityGm3(temperatureC, relativeHumidityPct) {
      const temperature = numberOrNull(temperatureC);
      const relativeHumidity = numberOrNull(relativeHumidityPct);

      if (
        temperature === null ||
        relativeHumidity === null ||
        temperature <= -243.12 ||
        relativeHumidity < 0 ||
        relativeHumidity > 100
      ) {
        return null;
      }

      const saturationVaporPressureHpa = 6.112 * Math.exp(
        17.62 * temperature / (243.12 + temperature)
      );
      const actualVaporPressureHpa = relativeHumidity / 100
        * saturationVaporPressureHpa;
      const absoluteHumidity = 216.7 * actualVaporPressureHpa
        / (273.15 + temperature);

      return Number.isFinite(absoluteHumidity) ? absoluteHumidity : null;
    }

    function formatValue(value, unit, digits) {
      const number = numberOrNull(value);
      return number === null ? "-" : `${number.toFixed(digits)} ${unit}`;
    }

    function formatTime(timeMs) {
      return new Intl.DateTimeFormat(undefined, {
        hour: "2-digit",
        minute: "2-digit",
      }).format(new Date(timeMs));
    }

    function formatXAxisTick(timeMs) {
      if (currentRangeDays <= 1) {
        return formatTime(timeMs);
      }

      return new Intl.DateTimeFormat(undefined, {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      }).format(new Date(timeMs));
    }

    function formatDateTime(timeMs) {
      return new Intl.DateTimeFormat(undefined, {
        dateStyle: "short",
        timeStyle: "medium",
      }).format(new Date(timeMs));
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    window.addEventListener("beforeunload", () => {
      temperatureChart?.destroy();
      humidityChart?.destroy();
      comfortChart?.destroy();
    });
  </script>
</body>
