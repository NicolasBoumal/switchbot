<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SwitchBot history</title>
  <script>
    (() => {
      try {
        const storedTheme = localStorage.getItem("switchbotTheme");
        const themeMedia = window.matchMedia?.("(prefers-color-scheme: dark)");
        const prefersDark = Boolean(themeMedia?.matches);
        const theme = storedTheme || (prefersDark ? "dark" : "light");

        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f8;
      --panel: #ffffff;
      --ink: #17201c;
      --muted: #66726d;
      --line: #d8dfdc;
      --button-bg: #ffffff;
      --button-border: #b9c4bf;
      --button-hover: #eef3f1;
      --chart-grid: #edf1ef;
      --shadow: rgb(20 30 25 / 6%);
      --error: #a12720;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #101412;
      --panel: #181f1c;
      --ink: #eef4f1;
      --muted: #a9b8b1;
      --line: #32403a;
      --button-bg: #202a26;
      --button-border: #50625a;
      --button-hover: #293630;
      --chart-grid: #202824;
      --shadow: rgb(0 0 0 / 22%);
      --error: #ff9288;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, sans-serif;
      line-height: 1.4;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2.5vw, 2.25rem);
      line-height: 1.1;
      letter-spacing: 0;
    }

    button {
      border: 1px solid var(--button-border);
      border-radius: 6px;
      background: var(--button-bg);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      padding: 0.48rem 0.75rem;
    }

    button:hover:not(:disabled) {
      background: var(--button-hover);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .auth-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status,
    .range {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .dashboard {
      display: grid;
      gap: 18px;
    }

    .chart-panel,
    .latest-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 2px var(--shadow);
    }

    .panel-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: 0;
    }

    .chart-box {
      height: 330px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    th,
    td {
      border-top: 1px solid var(--line);
      padding: 0.55rem 0.4rem;
      text-align: left;
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    .error {
      color: var(--error);
    }

    @media (max-width: 700px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 18px;
      }

      header,
      .toolbar,
      .panel-header {
        align-items: start;
        flex-direction: column;
      }

      .chart-box {
        height: 280px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>SwitchBot history</h1>
      <div class="auth-actions">
        <button id="themeButton" type="button" aria-pressed="false">Dark</button>
        <button id="signInButton" type="button">Sign in</button>
        <button id="signOutButton" type="button" hidden>Sign out</button>
        <div class="status" id="status">Sign in to load readings</div>
      </div>
    </header>

    <div class="toolbar">
      <div class="button-group" id="rangeButtons"></div>
      <div class="range" id="summary"></div>
    </div>

    <section class="dashboard">
      <section class="chart-panel" aria-labelledby="temperatureTitle">
        <div class="panel-header">
          <h2 id="temperatureTitle">Temperature</h2>
          <div class="range" id="temperatureRange"></div>
        </div>
        <div class="chart-box">
          <canvas id="temperatureChart"></canvas>
        </div>
      </section>

      <section class="chart-panel" aria-labelledby="humidityTitle">
        <div class="panel-header">
          <h2 id="humidityTitle">Humidity</h2>
          <div class="range" id="humidityRange"></div>
        </div>
        <div class="chart-box">
          <canvas id="humidityChart"></canvas>
        </div>
      </section>

      <section class="latest-panel" aria-labelledby="latestTitle">
        <div class="panel-header">
          <h2 id="latestTitle">Latest logged reading</h2>
        </div>
        <div id="latestReading"></div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      onAuthStateChanged,
      signInWithPopup,
      signOut,
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc,
      getDoc,
      getFirestore,
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import {
      getReadingsLast24Hours,
      getReadingsLast7Days,
      getReadingsLast30Days,
      setClientKey,
      setWorkerBase,
    } from "./switchbotapi.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBwLI4d70iDuAaf7fNwn0WX-kny01nmT5k",
      authDomain: "common-77900.firebaseapp.com",
      projectId: "common-77900",
      storageBucket: "common-77900.firebasestorage.app",
      messagingSenderId: "667782892801",
      appId: "1:667782892801:web:a30ef02706b7c385b51f00",
    };

    const SENSORS = [
      {
        name: "Terrace",
        color: "#c43f2f",
        darkColor: "#ff776c",
        temperatureKey: "terrace_temp_c",
        humidityKey: "terrace_humidity_pct",
      },
      {
        name: "Kitchen",
        color: "#2374ab",
        darkColor: "#61bfff",
        temperatureKey: "kitchen_temp_c",
        humidityKey: "kitchen_humidity_pct",
      },
      {
        name: "Bedroom",
        color: "#238b45",
        darkColor: "#68df91",
        temperatureKey: "bedroom_temp_c",
        humidityKey: "bedroom_humidity_pct",
      },
    ];

    const METEOSWISS_STATION = {
      label: "MeteoSwiss Pully",
      station: "PUY",
      tenMinute: {
        urls: [
          "https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/puy/ogd-smn_puy_t_recent.csv",
          "https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/puy/ogd-smn_puy_t_now.csv",
        ],
        temperatureKey: "tre200s0",
      },
      hourly: {
        urls: [
          "https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/puy/ogd-smn_puy_h_recent.csv",
          "https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/puy/ogd-smn_puy_h_now.csv",
        ],
        temperatureKey: "tre200h0",
      },
      color: "#6d5bd0",
      darkColor: "#c4b5ff",
    };

    const METEOSWISS_FORECAST = {
      label: "MeteoSwiss forecast Morges",
      pointId: "10312",
      pointTypeId: "1",
      collectionUrl: "https://data.geo.admin.ch/api/stac/v1/collections/ch.meteoschweiz.ogd-local-forecasting/items",
      temperatureKey: "tre200h0",
      color: "#8b5a2b",
      darkColor: "#f5c16c",
    };

    const RANGES = [
      {
        label: "last 24 hours",
        buttonText: "Load last 24 hours",
        days: 1,
        loader: () => getReadingsLast24Hours({ limit: 2000 }),
      },
      {
        label: "last 7 days",
        buttonText: "Load last 7 days",
        days: 7,
        loader: () => getReadingsLast7Days({ limit: 12000 }),
      },
      {
        label: "last 30 days",
        buttonText: "Load last 30 days",
        days: 30,
        loader: () => getReadingsLast30Days({ limit: 45000 }),
      },
    ];

    const rangeButtonsEl = document.getElementById("rangeButtons");
    const themeButton = document.getElementById("themeButton");
    const signInButton = document.getElementById("signInButton");
    const signOutButton = document.getElementById("signOutButton");
    const statusEl = document.getElementById("status");
    const summaryEl = document.getElementById("summary");
    const latestReadingEl = document.getElementById("latestReading");
    const temperatureRangeEl = document.getElementById("temperatureRange");
    const humidityRangeEl = document.getElementById("humidityRange");

    let rows = [];
    let currentRangeDays = 1;
    let temperatureChart = null;
    let humidityChart = null;
    let isAuthorized = false;
    let hasTriedAutoSignIn = false;
    let hasAutoLoadedInitialRange = false;
    let meteoSwissRows = [];
    let forecastRows = [];

    initializeTheme();
    const loadButtons = renderRangeButtons();
    createCharts();
    setLoading(true);
    initializeFirebaseAuth();

    function initializeTheme() {
      const storedTheme = getStoredTheme();
      const themeMedia = window.matchMedia?.("(prefers-color-scheme: dark)");
      const prefersDark = Boolean(themeMedia?.matches);
      const initialTheme = storedTheme || (prefersDark ? "dark" : "light");

      setTheme(initialTheme);

      themeButton.addEventListener("click", () => {
        const nextTheme = document.documentElement.dataset.theme === "dark"
          ? "light"
          : "dark";

        storeTheme(nextTheme);
        setTheme(nextTheme);
      });

      themeMedia?.addEventListener("change", event => {
        if (getStoredTheme()) {
          return;
        }

        setTheme(event.matches ? "dark" : "light");
      });
    }

    function setTheme(theme) {
      const isDark = theme === "dark";

      document.documentElement.dataset.theme = isDark ? "dark" : "light";
      themeButton.textContent = isDark ? "Light" : "Dark";
      themeButton.setAttribute("aria-pressed", String(isDark));
      applyChartTheme();
    }

    function getStoredTheme() {
      try {
        return localStorage.getItem("switchbotTheme");
      } catch {
        return null;
      }
    }

    function storeTheme(theme) {
      try {
        localStorage.setItem("switchbotTheme", theme);
      } catch {
        // Theme persistence is nice to have; the toggle still works without it.
      }
    }

    function applyChartTheme() {
      [temperatureChart, humidityChart].forEach(chart => {
        if (!chart) {
          return;
        }

        const ink = cssVar("--ink");
        const muted = cssVar("--muted");
        const grid = cssVar("--chart-grid");

        chart.options.plugins.legend.labels.color = ink;
        chart.options.scales.x.grid.color = grid;
        chart.options.scales.x.ticks.color = muted;
        chart.options.scales.y.grid.color = grid;
        chart.options.scales.y.ticks.color = muted;
        chart.options.scales.y.title.color = muted;
        chart.data.datasets.forEach(dataset => {
          const sensor = SENSORS.find(item => item.name === dataset.label);

          if (sensor) {
            const color = sensorChartColor(sensor);
            dataset.borderColor = color;
            dataset.backgroundColor = color;
          }

          if (dataset.label === METEOSWISS_STATION.label) {
            const color = meteoSwissChartColor();
            dataset.borderColor = color;
            dataset.backgroundColor = color;
          }

          if (dataset.label === METEOSWISS_FORECAST.label) {
            const color = forecastChartColor();
            dataset.borderColor = color;
            dataset.backgroundColor = color;
          }
        });
        chart.update();
      });
    }

    function initializeFirebaseAuth() {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const provider = new GoogleAuthProvider();

      signInButton.addEventListener("click", () => {
        signInWithPopup(auth, provider).catch(showError);
      });

      signOutButton.addEventListener("click", () => {
        signOut(auth).catch(showError);
      });

      onAuthStateChanged(auth, user => {
        handleAuthState(user, auth, provider, db).catch(showError);
      });
    }

    async function handleAuthState(user, auth, provider, db) {
      setClientKey("");
      setWorkerBase("");
      isAuthorized = false;
      rows = [];
      meteoSwissRows = [];
      forecastRows = [];
      updateChart(temperatureChart, "temperatureKey", "C", temperatureRangeEl);
      updateChart(humidityChart, "humidityKey", "%", humidityRangeEl);
      renderLatestReading();

      signInButton.hidden = Boolean(user);
      signOutButton.hidden = !user;

      if (!user) {
        summaryEl.textContent = "";
        hasAutoLoadedInitialRange = false;
        setStatus("Sign in to load readings");
        setLoading(true);
        tryAutoSignIn(auth, provider);
        return;
      }

      setStatus("Loading access...");
      const secretSnapshot = await getDoc(doc(db, "secrets", "switchbot"));

      if (!secretSnapshot.exists()) {
        throw new Error("Missing Firestore document secrets/switchbot.");
      }

      const secret = secretSnapshot.data();
      const clientKey = secret.CLIENTKEY;
      const workerUrl = secret.WORKERURL;

      if (typeof clientKey !== "string" || clientKey.length === 0) {
        throw new Error("Missing Firestore field secrets/switchbot.CLIENTKEY.");
      }

      if (typeof workerUrl !== "string" || workerUrl.length === 0) {
        throw new Error("Missing Firestore field secrets/switchbot.WORKERURL.");
      }

      setClientKey(clientKey);
      setWorkerBase(workerUrl);
      isAuthorized = true;
      setStatus(`Signed in as ${user.email}`);
      setLoading(false);

      if (!hasAutoLoadedInitialRange) {
        hasAutoLoadedInitialRange = true;
        await loadHistory(RANGES[0]);
      }
    }

    function tryAutoSignIn(auth, provider) {
      if (hasTriedAutoSignIn) {
        return;
      }

      hasTriedAutoSignIn = true;
      setStatus("Opening sign-in...");

      signInWithPopup(auth, provider).catch(error => {
        if (
          error?.code === "auth/popup-closed-by-user" ||
          error?.code === "auth/cancelled-popup-request"
        ) {
          setStatus("Sign in to load readings");
          return;
        }

        if (error?.code === "auth/popup-blocked") {
          setStatus("Popup blocked. Use Sign in to load readings.");
          setLoading(false);
          return;
        }

        showError(error);
      });
    }

    async function loadHistory({ label, days, loader }) {
      if (!isAuthorized) {
        setStatus("Sign in to load readings");
        return;
      }

      setLoading(true);
      currentRangeDays = days;
      setStatus(`Loading ${label}...`);

      const loadedAt = Date.now();
      const data = await loader();
      rows = (data.rows ?? [])
        .map(normalizeRow)
        .filter(row => Number.isFinite(row.timeMs))
        .sort((a, b) => a.timeMs - b.timeMs);

      let meteoSwissError = null;
      let forecastError = null;

      if (days === 1 || days === 7 || days === 30) {
        try {
          meteoSwissRows = await loadMeteoSwissReadings(days, loadedAt);
        } catch (error) {
          meteoSwissRows = [];
          meteoSwissError = error;
          console.warn(error);
        }
      } else {
        meteoSwissRows = [];
      }

      if (days === 1 || days === 7 || days === 30) {
        try {
          forecastRows = await loadMeteoSwissForecast(
            loadedAt - 24 * 60 * 60 * 1000,
            loadedAt + days * 24 * 60 * 60 * 1000
          );
        } catch (error) {
          forecastRows = [];
          forecastError = error;
          console.warn(error);
        }
      } else {
        forecastRows = [];
      }

      updateChart(temperatureChart, "temperatureKey", "C", temperatureRangeEl);
      updateChart(humidityChart, "humidityKey", "%", humidityRangeEl);
      renderLatestReading();

      const first = rows.at(0);
      const last = rows.at(-1);
      summaryEl.textContent = rows.length && first && last
        ? `${rows.length} readings from ${formatTime(first.timeMs)} to ${formatTime(last.timeMs)}`
        : "No readings found.";

      setStatus(
        meteoSwissError || forecastError
          ? `Updated ${formatTime(loadedAt)} (some MeteoSwiss data unavailable)`
          : `Updated ${formatTime(loadedAt)}`
      );
      setLoading(false);
    }

    function renderRangeButtons() {
      return RANGES.map(range => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = range.buttonText;
        button.addEventListener("click", () => {
          loadHistory(range).catch(showError);
        });
        rangeButtonsEl.append(button);
        return button;
      });
    }

    function createCharts() {
      temperatureChart = createLineChart("temperatureChart", "Temperature", "C");
      humidityChart = createLineChart("humidityChart", "Humidity", "%");
      applyChartTheme();
    }

    function createLineChart(canvasId, label, unit) {
      const grid = cssVar("--chart-grid");
      const muted = cssVar("--muted");

      return new Chart(document.getElementById(canvasId), {
        type: "line",
        data: {
          datasets: [],
        },
        options: {
          animation: false,
          maintainAspectRatio: false,
          responsive: true,
          interaction: {
            intersect: false,
            mode: "nearest",
          },
          plugins: {
            legend: {
              position: "bottom",
              labels: {
                boxWidth: 12,
                boxHeight: 12,
                color: cssVar("--ink"),
              },
            },
            tooltip: {
              callbacks: {
                title: items => items.length ? formatDateTime(items[0].parsed.x) : "",
                label: item => `${item.dataset.label}: ${item.parsed.y.toFixed(1)} ${unit}`,
              },
            },
          },
          scales: {
            x: {
              type: "linear",
              grid: {
                color: grid,
              },
              ticks: {
                callback: value => formatXAxisTick(value),
                color: muted,
                maxTicksLimit: 8,
              },
            },
            y: {
              position: "right",
              title: {
                display: true,
                text: `${label} (${unit})`,
                color: muted,
              },
              grid: {
                color: grid,
              },
              ticks: {
                color: muted,
              },
            },
          },
        },
      });
    }

    function updateChart(chart, sensorValueKey, unit, rangeEl) {
      const allValues = [];

      chart.data.datasets = SENSORS.map(sensor => {
        const data = rows
          .map(row => ({
            x: row.timeMs,
            y: numberOrNull(row[sensor[sensorValueKey]]),
          }))
          .filter(point => point.y !== null);

        allValues.push(...data.map(point => point.y));

        return {
          label: sensor.name,
          data,
          borderColor: sensorChartColor(sensor),
          backgroundColor: sensorChartColor(sensor),
          borderWidth: 2.5,
          pointRadius: 0,
          pointHoverRadius: 4,
          spanGaps: true,
          tension: 0.25,
        };
      });

      if (chart === temperatureChart && meteoSwissRows.length > 0) {
        const data = meteoSwissRows.map(row => ({
          x: row.timeMs,
          y: row.temperatureC,
        }));

        allValues.push(...data.map(point => point.y));
        chart.data.datasets.push({
          label: METEOSWISS_STATION.label,
          data,
          borderColor: meteoSwissChartColor(),
          backgroundColor: meteoSwissChartColor(),
          borderDash: [6, 4],
          borderWidth: 2.5,
          pointRadius: 0,
          pointHoverRadius: 4,
          spanGaps: true,
          tension: 0.25,
        });
      }

      if (chart === temperatureChart && forecastRows.length > 0) {
        const data = forecastRows.map(row => ({
          x: row.timeMs,
          y: row.temperatureC,
        }));

        allValues.push(...data.map(point => point.y));
        chart.data.datasets.push({
          label: METEOSWISS_FORECAST.label,
          data,
          borderColor: forecastChartColor(),
          backgroundColor: forecastChartColor(),
          borderDash: [2, 5],
          borderWidth: 2.5,
          pointRadius: 0,
          pointHoverRadius: 4,
          spanGaps: true,
          tension: 0.25,
        });
      }

      rangeEl.textContent = allValues.length
        ? `${Math.min(...allValues).toFixed(1)}-${Math.max(...allValues).toFixed(1)} ${unit}`
        : "";

      chart.update();
    }

    function renderLatestReading() {
      const latest = rows.at(-1);

      if (!latest) {
        latestReadingEl.innerHTML = "<p>No readings found.</p>";
        return;
      }

      const cells = SENSORS.map(sensor => `
        <tr>
          <td>${sensor.name}</td>
          <td>${formatValue(latest[sensor.temperatureKey], "C", 1)}</td>
          <td>${formatValue(latest[sensor.humidityKey], "%", 0)}</td>
          <td>${formatValue(
            absoluteHumidityGm3(
              latest[sensor.temperatureKey],
              latest[sensor.humidityKey]
            ),
            "g/m³",
            1
          )}</td>
        </tr>
      `).join("");

      latestReadingEl.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Sensor</th>
              <th>Temperature</th>
              <th>Relative humidity</th>
              <th>Absolute humidity</th>
            </tr>
          </thead>
          <tbody>${cells}</tbody>
        </table>
      `;
    }

    function normalizeRow(row) {
      return {
        ...row,
        timeMs: Number(row.sampled_at_ms),
      };
    }

    async function loadMeteoSwissReadings(days, toMs) {
      const fromMs = toMs - days * 24 * 60 * 60 * 1000;
      const source = days === 1
        ? METEOSWISS_STATION.tenMinute
        : METEOSWISS_STATION.hourly;

      const texts = await Promise.all(
        source.urls.map(async url => {
          const response = await fetch(url);

          if (!response.ok) {
            throw new Error(`Could not load ${METEOSWISS_STATION.label} data: HTTP ${response.status}.`);
          }

          return response.text();
        })
      );

      const readingsByTime = new Map();

      texts.flatMap(parseCsv)
        .filter(row => row.station_abbr === METEOSWISS_STATION.station)
        .forEach(row => {
          const timeMs = parseMeteoSwissTimestamp(row.reference_timestamp);
          const temperatureC = numberOrNull(row[source.temperatureKey]);

          if (
            Number.isFinite(timeMs) &&
            timeMs >= fromMs &&
            timeMs <= toMs &&
            temperatureC !== null
          ) {
            readingsByTime.set(timeMs, { timeMs, temperatureC });
          }
        });

      return Array.from(readingsByTime.values())
        .sort((a, b) => a.timeMs - b.timeMs);
    }

    async function loadMeteoSwissForecast(fromMs, toMs) {
      const assetUrl = await findLatestForecastAssetUrl();
      const response = await fetch(assetUrl);

      if (!response.ok) {
        throw new Error(`Could not load ${METEOSWISS_FORECAST.label} data: HTTP ${response.status}.`);
      }

      const rowsByTime = new Map();

      parseCsv(await response.text())
        .filter(row =>
          row.point_id === METEOSWISS_FORECAST.pointId &&
          row.point_type_id === METEOSWISS_FORECAST.pointTypeId
        )
        .forEach(row => {
          const timeMs = parseCompactUtcTimestamp(row.Date);
          const temperatureC = numberOrNull(row[METEOSWISS_FORECAST.temperatureKey]);

          if (
            Number.isFinite(timeMs) &&
            timeMs >= fromMs &&
            timeMs <= toMs &&
            temperatureC !== null
          ) {
            rowsByTime.set(timeMs, { timeMs, temperatureC });
          }
        });

      return Array.from(rowsByTime.values())
        .sort((a, b) => a.timeMs - b.timeMs);
    }

    async function findLatestForecastAssetUrl() {
      const today = new Date();
      const candidateItemIds = [
        formatCompactUtcDate(today),
        formatCompactUtcDate(new Date(today.getTime() - 24 * 60 * 60 * 1000)),
      ];

      for (const itemId of candidateItemIds) {
        const response = await fetch(`${METEOSWISS_FORECAST.collectionUrl}/${itemId}-ch`);

        if (!response.ok) {
          continue;
        }

        const item = await response.json();
        const asset = Object.entries(item.assets ?? {})
          .filter(([name]) => name.endsWith(`.${METEOSWISS_FORECAST.temperatureKey}.csv`))
          .sort(([a], [b]) => b.localeCompare(a))
          .at(0);

        if (asset) {
          return asset[1].href;
        }
      }

      throw new Error(`Could not find ${METEOSWISS_FORECAST.label} data.`);
    }

    function parseCsv(text) {
      const lines = text.trim().split(/\r?\n/).filter(Boolean);

      if (lines.length < 2) {
        return [];
      }

      const headers = lines[0].split(";");

      return lines.slice(1).map(line => {
        const values = line.split(";");

        return Object.fromEntries(
          headers.map((header, index) => [header, values[index] ?? ""])
        );
      });
    }

    function parseMeteoSwissTimestamp(value) {
      const match = /^(\d{2})\.(\d{2})\.(\d{4}) (\d{2}):(\d{2})$/.exec(value);

      if (!match) {
        return NaN;
      }

      const [, day, month, year, hour, minute] = match.map(Number);

      return Date.UTC(year, month - 1, day, hour, minute);
    }

    function parseCompactUtcTimestamp(value) {
      const match = /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})$/.exec(value);

      if (!match) {
        return NaN;
      }

      const [, year, month, day, hour, minute] = match.map(Number);

      return Date.UTC(year, month - 1, day, hour, minute);
    }

    function formatCompactUtcDate(date) {
      return [
        date.getUTCFullYear(),
        String(date.getUTCMonth() + 1).padStart(2, "0"),
        String(date.getUTCDate()).padStart(2, "0"),
      ].join("");
    }

    function showError(error) {
      setStatus("Error");
      summaryEl.textContent = "";
      latestReadingEl.innerHTML = `<p class="error">${escapeHtml(error.stack || String(error))}</p>`;
      setLoading(false);
    }

    function setLoading(isLoading) {
      loadButtons.forEach(button => {
        button.disabled = isLoading;
      });
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function cssVar(name) {
      return getComputedStyle(document.documentElement)
        .getPropertyValue(name)
        .trim();
    }

    function sensorChartColor(sensor) {
      return document.documentElement.dataset.theme === "dark"
        ? sensor.darkColor
        : sensor.color;
    }

    function meteoSwissChartColor() {
      return document.documentElement.dataset.theme === "dark"
        ? METEOSWISS_STATION.darkColor
        : METEOSWISS_STATION.color;
    }

    function forecastChartColor() {
      return document.documentElement.dataset.theme === "dark"
        ? METEOSWISS_FORECAST.darkColor
        : METEOSWISS_FORECAST.color;
    }

    function numberOrNull(value) {
      if (value === null || value === undefined || value === "") {
        return null;
      }

      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function absoluteHumidityGm3(temperatureC, relativeHumidityPct) {
      const temperature = numberOrNull(temperatureC);
      const relativeHumidity = numberOrNull(relativeHumidityPct);

      if (
        temperature === null ||
        relativeHumidity === null ||
        temperature <= -243.12 ||
        relativeHumidity < 0 ||
        relativeHumidity > 100
      ) {
        return null;
      }

      const saturationVaporPressureHpa = 6.112 * Math.exp(
        17.62 * temperature / (243.12 + temperature)
      );
      const actualVaporPressureHpa = relativeHumidity / 100
        * saturationVaporPressureHpa;
      const absoluteHumidity = 216.7 * actualVaporPressureHpa
        / (273.15 + temperature);

      return Number.isFinite(absoluteHumidity) ? absoluteHumidity : null;
    }

    function formatValue(value, unit, digits) {
      const number = numberOrNull(value);
      return number === null ? "-" : `${number.toFixed(digits)} ${unit}`;
    }

    function formatTime(timeMs) {
      return new Intl.DateTimeFormat(undefined, {
        hour: "2-digit",
        minute: "2-digit",
      }).format(new Date(timeMs));
    }

    function formatXAxisTick(timeMs) {
      if (currentRangeDays <= 1) {
        return formatTime(timeMs);
      }

      return new Intl.DateTimeFormat(undefined, {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      }).format(new Date(timeMs));
    }

    function formatDateTime(timeMs) {
      return new Intl.DateTimeFormat(undefined, {
        dateStyle: "short",
        timeStyle: "medium",
      }).format(new Date(timeMs));
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    window.addEventListener("beforeunload", () => {
      temperatureChart?.destroy();
      humidityChart?.destroy();
    });
  </script>
</body>
